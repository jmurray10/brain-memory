<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 786" width="1536" height="1257" role="img" aria-label="Brain-Memory: your model sends turns and claims through one API; the write path checks and files them; Postgres holds episodes, vectors, the claim ledger, pages and the decision log; the read path routes, searches, reranks, screens and builds a context pack; a nightly pass settles, renders and backs up. Each step is marked as done by Jev, Voyage, code or Postgres." font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
<rect width="960" height="786" fill="#ffffff"/>
<rect x="270" y="16" width="420" height="58" rx="10" fill="#1f2328"/>
<text x="480" y="40" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Your model (Claude, GPT, any client)</text>
<text x="480" y="60" font-size="12" font-weight="400" fill="#d0d7de" text-anchor="middle">talks to the user, extracts the claims, writes the answers</text>
<rect x="20" y="104" width="920" height="38" rx="8" fill="#eef1f4" stroke="#d0d7de"/>
<text x="480" y="128" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">One API: MCP, REST, CLI.  A key per client, namespaces, accounts kept apart by row-level security</text>
<line x1="330" y1="74" x2="330" y2="102" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<text x="322" y="93" font-size="12" font-weight="600" fill="#57606a" text-anchor="end">turns + claims</text>
<line x1="630" y1="104" x2="630" y2="76" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<text x="638" y="93" font-size="12" font-weight="600" fill="#57606a" text-anchor="start">context pack, about 1,400 tokens</text>
<rect x="20" y="160" width="300" height="462" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="170.0" y="184" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Write path</text>
<text x="170.0" y="202" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">every saved turn</text>
<rect x="330" y="160" width="300" height="462" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="480.0" y="184" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Store</text>
<text x="480.0" y="202" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">Postgres with pgvector</text>
<rect x="640" y="160" width="300" height="462" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="790.0" y="184" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Read path</text>
<text x="790.0" y="202" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">every question about the past</text>
<rect x="30" y="216" width="280" height="49" rx="7" fill="#ffffff" stroke="#d0d7de"/>
<text x="42" y="236.5" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">1  Capture</text>
<text x="42" y="254.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">store the turn, embed each line</text>
<rect x="242" y="221.5" width="58" height="19" rx="9.5" fill="#d6e6ff"/>
<text x="271.0" y="235.0" font-size="11.5" font-weight="600" fill="#0b3d91" text-anchor="middle">Voyage</text>
<rect x="195" y="221.5" width="42" height="19" rx="9.5" fill="#e6e8eb"/>
<text x="216.0" y="235.0" font-size="11.5" font-weight="600" fill="#2d333b" text-anchor="middle">code</text>
<rect x="30" y="273" width="280" height="49" rx="7" fill="#ffffff" stroke="#d0d7de"/>
<text x="42" y="293.5" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">2  Triage</text>
<text x="42" y="311.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">does it state anything lasting?</text>
<rect x="264" y="278.5" width="36" height="19" rx="9.5" fill="#fde7c7"/>
<text x="282.0" y="292.0" font-size="11.5" font-weight="600" fill="#8a4b00" text-anchor="middle">Jev</text>
<rect x="30" y="330" width="280" height="49" rx="7" fill="#ffffff" stroke="#d0d7de"/>
<text x="42" y="350.5" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">3  Dates</text>
<text x="42" y="368.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">name the time phrase, compute the date</text>
<rect x="258" y="335.5" width="42" height="19" rx="9.5" fill="#e6e8eb"/>
<text x="279.0" y="349.0" font-size="11.5" font-weight="600" fill="#2d333b" text-anchor="middle">code</text>
<rect x="217" y="335.5" width="36" height="19" rx="9.5" fill="#fde7c7"/>
<text x="235.0" y="349.0" font-size="11.5" font-weight="600" fill="#8a4b00" text-anchor="middle">Jev</text>
<rect x="30" y="387" width="280" height="49" rx="7" fill="#ffffff" stroke="#d0d7de"/>
<text x="42" y="407.5" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">4  Check claims</text>
<text x="42" y="425.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">quote must be in the turn; score fields</text>
<rect x="264" y="392.5" width="36" height="19" rx="9.5" fill="#fde7c7"/>
<text x="282.0" y="406.0" font-size="11.5" font-weight="600" fill="#8a4b00" text-anchor="middle">Jev</text>
<rect x="217" y="392.5" width="42" height="19" rx="9.5" fill="#e6e8eb"/>
<text x="238.0" y="406.0" font-size="11.5" font-weight="600" fill="#2d333b" text-anchor="middle">code</text>
<rect x="30" y="444" width="280" height="49" rx="7" fill="#ffffff" stroke="#d0d7de"/>
<text x="42" y="464.5" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">5  Who or what</text>
<text x="42" y="482.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">same person or thing as one known?</text>
<rect x="264" y="449.5" width="36" height="19" rx="9.5" fill="#fde7c7"/>
<text x="282.0" y="463.0" font-size="11.5" font-weight="600" fill="#8a4b00" text-anchor="middle">Jev</text>
<rect x="30" y="501" width="280" height="49" rx="7" fill="#ffffff" stroke="#d0d7de"/>
<text x="42" y="521.5" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">6  Which attribute</text>
<text x="42" y="539.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">join an existing slot or open a new one</text>
<rect x="264" y="506.5" width="36" height="19" rx="9.5" fill="#fde7c7"/>
<text x="282.0" y="520.0" font-size="11.5" font-weight="600" fill="#8a4b00" text-anchor="middle">Jev</text>
<rect x="30" y="558" width="280" height="49" rx="7" fill="#ffffff" stroke="#d0d7de"/>
<text x="42" y="578.5" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">7  Relate</text>
<text x="42" y="596.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">same, updates, adds or contradicts</text>
<rect x="264" y="563.5" width="36" height="19" rx="9.5" fill="#fde7c7"/>
<text x="282.0" y="577.0" font-size="11.5" font-weight="600" fill="#8a4b00" text-anchor="middle">Jev</text>
<rect x="340" y="216" width="280" height="71" rx="7" fill="#f0faf3" stroke="#a7d7b5"/>
<text x="352" y="247.5" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Episodes</text>
<text x="352" y="265.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">raw turns, never edited: the ground truth</text>
<rect x="340" y="296" width="280" height="71" rx="7" fill="#f0faf3" stroke="#a7d7b5"/>
<text x="352" y="327.5" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Lines and vectors</text>
<text x="352" y="345.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">1,024-number vectors and a keyword index</text>
<rect x="340" y="376" width="280" height="71" rx="7" fill="#f0faf3" stroke="#a7d7b5"/>
<text x="352" y="407.5" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Claim ledger</text>
<text x="352" y="425.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">who, attribute, value, dates, exact quote</text>
<rect x="340" y="456" width="280" height="71" rx="7" fill="#f0faf3" stroke="#a7d7b5"/>
<text x="352" y="487.5" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Pages and directives</text>
<text x="352" y="505.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">views rendered from claims</text>
<rect x="340" y="536" width="280" height="71" rx="7" fill="#f0faf3" stroke="#a7d7b5"/>
<text x="352" y="567.5" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Decision log</text>
<text x="352" y="585.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">every decision with its probability</text>
<rect x="650" y="216.0" width="280" height="59" rx="7" fill="#ffffff" stroke="#d0d7de"/>
<text x="662" y="241.5" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">1  Route</text>
<text x="662" y="259.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">current, history, date, count, open search</text>
<rect x="884" y="226.5" width="36" height="19" rx="9.5" fill="#fde7c7"/>
<text x="902.0" y="240.0" font-size="11.5" font-weight="600" fill="#8a4b00" text-anchor="middle">Jev</text>
<rect x="650" y="282.4" width="280" height="59" rx="7" fill="#ffffff" stroke="#d0d7de"/>
<text x="662" y="307.9" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">2  Search</text>
<text x="662" y="325.9" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">keyword search plus vector search</text>
<rect x="862" y="292.9" width="58" height="19" rx="9.5" fill="#d6e6ff"/>
<text x="891.0" y="306.4" font-size="11.5" font-weight="600" fill="#0b3d91" text-anchor="middle">Voyage</text>
<rect x="789" y="292.9" width="68" height="19" rx="9.5" fill="#d5f0dc"/>
<text x="823.0" y="306.4" font-size="11.5" font-weight="600" fill="#14532d" text-anchor="middle">Postgres</text>
<rect x="650" y="348.8" width="280" height="59" rx="7" fill="#ffffff" stroke="#d0d7de"/>
<text x="662" y="374.3" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">3  Rerank</text>
<text x="662" y="392.3" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">which passages answer the question?</text>
<rect x="884" y="359.3" width="36" height="19" rx="9.5" fill="#fde7c7"/>
<text x="902.0" y="372.8" font-size="11.5" font-weight="600" fill="#8a4b00" text-anchor="middle">Jev</text>
<rect x="650" y="415.20000000000005" width="280" height="59" rx="7" fill="#ffffff" stroke="#d0d7de"/>
<text x="662" y="440.70000000000005" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">4  Screen</text>
<text x="662" y="458.70000000000005" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">drop passages carrying instructions</text>
<rect x="884" y="425.70000000000005" width="36" height="19" rx="9.5" fill="#fde7c7"/>
<text x="902.0" y="439.20000000000005" font-size="11.5" font-weight="600" fill="#8a4b00" text-anchor="middle">Jev</text>
<rect x="650" y="481.6" width="280" height="59" rx="7" fill="#ffffff" stroke="#d0d7de"/>
<text x="662" y="507.1" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">5  Compute</text>
<text x="662" y="525.1" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">date arithmetic, counts, what replaced what</text>
<rect x="878" y="492.1" width="42" height="19" rx="9.5" fill="#e6e8eb"/>
<text x="899.0" y="505.6" font-size="11.5" font-weight="600" fill="#2d333b" text-anchor="middle">code</text>
<rect x="650" y="548.0" width="280" height="59" rx="7" fill="#ffffff" stroke="#d0d7de"/>
<text x="662" y="573.5" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">6  Build the pack</text>
<text x="662" y="591.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">excerpts, nearby turns, dates, facts</text>
<rect x="878" y="558.5" width="42" height="19" rx="9.5" fill="#e6e8eb"/>
<text x="899.0" y="572.0" font-size="11.5" font-weight="600" fill="#2d333b" text-anchor="middle">code</text>
<line x1="312" y1="419.0" x2="338" y2="419.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="622" y1="419.0" x2="648" y2="419.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20" y="640" width="920" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="34" y="665" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Nightly pass (a worker, not inside requests)</text>
<text x="34" y="686" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">settle uncertain links and disputes, promote stated preferences to pending directives, render pages, re-ask a sample of decisions, back up</text>
<rect x="886" y="651" width="42" height="19" rx="9.5" fill="#e6e8eb"/>
<text x="907.0" y="664.5" font-size="11.5" font-weight="600" fill="#2d333b" text-anchor="middle">code</text>
<rect x="845" y="651" width="36" height="19" rx="9.5" fill="#fde7c7"/>
<text x="863.0" y="664.5" font-size="11.5" font-weight="600" fill="#8a4b00" text-anchor="middle">Jev</text>
<line x1="480" y1="640" x2="480" y2="624" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20" y="720" width="36" height="19" rx="9.5" fill="#fde7c7"/>
<text x="38.0" y="733.5" font-size="11.5" font-weight="600" fill="#8a4b00" text-anchor="middle">Jev</text>
<text x="63" y="733.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">TypeSafe Jev: typed questions answered with a probability; not a generative model</text>
<rect x="20" y="747" width="58" height="19" rx="9.5" fill="#d6e6ff"/>
<text x="49.0" y="760.5" font-size="11.5" font-weight="600" fill="#0b3d91" text-anchor="middle">Voyage</text>
<text x="85" y="760.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">embeddings</text>
<rect x="170" y="747" width="42" height="19" rx="9.5" fill="#e6e8eb"/>
<text x="191.0" y="760.5" font-size="11.5" font-weight="600" fill="#2d333b" text-anchor="middle">code</text>
<text x="219" y="760.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">computed, no model</text>
<rect x="350" y="747" width="68" height="19" rx="9.5" fill="#d5f0dc"/>
<text x="384.0" y="760.5" font-size="11.5" font-weight="600" fill="#14532d" text-anchor="middle">Postgres</text>
<text x="425" y="760.5" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">the database</text>
<text x="940" y="760.5" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="end">There is no generative model inside the brain.</text>
</svg>
